<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10291d">
<title>Bingo card · Christmas Movie Bingo</title>
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<header class="site-header"><h1><span class="kicker">✦ A holiday-movie watch-along ✦</span>Christmas Movie <em>Bingo</em></h1></header>
<main>
  <p id="view-status" class="hint" role="status">Loading card…</p>
  <div id="view" hidden>
    <h2 id="view-title"></h2>
    <div class="view-meta">
      <span id="view-score" class="note"></span>
      <span id="view-movie"></span>
    </div>
    <div id="view-grid" class="grid" role="list" aria-label="Bingo card"></div>
    <p class="hint">Green squares have been spotted. <a href="./">Play your own card</a></p>
  </div>
</main>
<script src="config.js?v=12"></script>
<script src="shared.js?v=12"></script>
<script src="view.js?v=12"></script>
</body>
</html>
